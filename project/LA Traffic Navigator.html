<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LA Traffic Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0a0c10; -webkit-font-smoothing: antialiased; }
  #root { width: 100vw; height: 100vh; }

  /* traffic / route flow dashes */
  @keyframes om-flow { to { stroke-dashoffset: -28; } }
  .om-flow { animation: om-flow 0.9s linear infinite; }

  /* pulsing radius on incident + user puck halos */
  .om-pulse { transform-box: fill-box; transform-origin: center; animation: om-pulse 2.4s ease-out infinite; }
  @keyframes om-pulse {
    0%   { transform: scale(0.55); opacity: 0.55; }
    70%  { transform: scale(1.7); opacity: 0; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* search caret blink */
  @keyframes om-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
  .om-caret { animation: om-blink 1.05s steps(1) infinite; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" rx="22" fill="#0a0e14"/>
    <path d="M28 78 C40 60 46 44 64 22" fill="none" stroke="#00e5a0" stroke-width="6" stroke-linecap="round"/>
    <circle cx="28" cy="78" r="6" fill="#00e5a0"/>
    <path d="M64 22 l3 8 -3 -2 -3 2 z" fill="#00e5a0"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="map.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>

<script type="text/babel" src="app.jsx"></script>
</body>
</html>
